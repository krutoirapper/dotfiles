background {
    monitor =
    path = screenshot          # берёт текущий скриншот экрана
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2            # делает красивое размытие фонового экрана
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Введи пароль...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Большие часы по центру экрана
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}
